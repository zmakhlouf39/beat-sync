name: CI
on:
    push:
        branches: [main]
    pull_request:
jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5 
              with:
                    node-version: 22
                    cache: npm
                    cache-dependency-path: beat-sync-cut-finder/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run test:run
            - run: npm run build